<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمایشگاه دوربین Three.js</title><style>body{margin:0;background:#0b1220;color:#fff;font:14px Tahoma}main{display:grid;grid-template-columns:1fr 300px;height:100vh}#view{width:100%;height:100%;display:block}.panel{padding:24px;background:#141f31;overflow:auto}h1{font-size:22px}label{display:block;margin:22px 0}input{width:100%}button{background:#ffb65c;border:0;padding:9px 13px;border-radius:7px;cursor:pointer}small{color:#b9c9d9}code{direction:ltr;display:block;text-align:left;color:#84efca}@media(max-width:720px){main{grid-template-columns:1fr;grid-template-rows:58vh 1fr}}</style></head><body><main><canvas id="view"></canvas><aside class="panel"><h1>آزمایشگاه واقعی دوربین</h1><p>کنترل میدان دید، Orbit، فاصله و زاویه دوربین. کد از Three.js و GSAP با ماژول ES استفاده می‌کند.</p><label>فاصله دوربین <input id="distance" type="range" min="2.5" max="11" value="6" step=".1"></label><label>میدان دید (FOV) <input id="fov" type="range" min="20" max="95" value="45"></label><label>زاویه مدار <input id="angle" type="range" min="-180" max="180" value="25"></label><button id="dolly">Dolly In</button> <button id="orbit">Orbit 90°</button> <button id="reset">بازنشانی</button><p><small>این دموی WebGL به بارگذاری CDN نیاز دارد. برای استفاده آفلاین، فایل‌های کتابخانه را محلی کن.</small></p><code>camera.fov = value;<br>camera.updateProjectionMatrix();<br>gsap.to(camera.position, ...)</code></aside></main><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';import {gsap} from 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm';const c=document.getElementById('view'),r=new THREE.WebGLRenderer({canvas:c,antialias:true}),scene=new THREE.Scene();scene.background=new THREE.Color('#0c1728');const camera=new THREE.PerspectiveCamera(45,1,.1,100);scene.add(new THREE.HemisphereLight(0xd9ecff,0x26354c,1.7));const key=new THREE.DirectionalLight(0xffc88b,3);key.position.set(3,5,6);scene.add(key);const fill=new THREE.PointLight(0x679bff,35);fill.position.set(-4,0,3);scene.add(fill);const shape=new THREE.Mesh(new THREE.IcosahedronGeometry(1.45,1),new THREE.MeshStandardMaterial({color:0xd78d63,metalness:.45,roughness:.28,flatShading:true}));scene.add(shape);const floor=new THREE.GridHelper(16,20,0x31567a,0x23334d);floor.position.y=-1.85;scene.add(floor);const $=id=>document.getElementById(id);function pose(){let d=+$('distance').value,a=+$('angle').value*Math.PI/180;camera.position.set(Math.sin(a)*d,d*.15,Math.cos(a)*d);camera.lookAt(0,0,0);camera.fov=+$('fov').value;camera.updateProjectionMatrix()}['distance','fov','angle'].forEach(x=>$(x).addEventListener('input',pose));$('dolly').onclick=()=>{let obj={n:+$('distance').value};gsap.to(obj,{n:3.1,duration:1.5,ease:'power2.inOut',onUpdate(){ $('distance').value=obj.n;pose()}})};$('orbit').onclick=()=>{let obj={n:+$('angle').value};gsap.to(obj,{n:obj.n+90,duration:1.6,ease:'power2.inOut',onUpdate(){ $('angle').value=((obj.n+180)%360+360)%360-180;pose()}})};$('reset').onclick=()=>{$('distance').value=6;$('angle').value=25;$('fov').value=45;pose()};function size(){const w=c.clientWidth,h=c.clientHeight;r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}const observer=new ResizeObserver(size);observer.observe(c);size();pose();let old=0;function loop(now){let dt=Math.min((now-old)/1000,.05)||0;old=now;shape.rotation.y+=dt*.12;r.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
